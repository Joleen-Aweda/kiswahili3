<body class="min-h-screen flex items-center justify-center">

      <div class="container mx-auto max-w-5xl bg-[#f8f6ef] rounded-[2rem] border-2 border-orange-400 px-10 max-lg:px-8 max-sm:px-4 pt-8 pb-10 opacity-0" id="content">
  <section data-section-type="text_only" data-section-id="pg035_sec002" class="max-w-4xl mx-auto font-serif text-[#2c2a2a]">
    <div class="mb-5 text-left text-[1.55rem] leading-[1.35] font-semibold max-lg:text-[1.35rem] max-sm:text-[0.92rem]">
      <span data-id="pg035_n0087">K.</span>
      <span data-id="pg035_n0088">Andika kinyume cha maneno yaliyokozwa wino katika sentensi hizi.</span>
    </div>

    <div class="space-y-3 pl-8 max-lg:pl-6 max-sm:pl-2 text-[1.1rem] leading-[1.8] max-lg:text-[1rem] max-sm:text-[0.82rem]">
      <p class="text-left">
        <span data-id="pg035_n0089">(i) Baba alipanda kwenye gari <strong>dogo</strong>.</span>
      </p>
      <p class="text-left">
        <span data-id="pg035_n0090">(ii) Limbi anasoma shule iliyopo <strong>mbali</strong>.</span>
      </p>
      <p class="text-left">
        <span data-id="pg035_n0091">(iii) Kitanda changu ni <strong>kifupi</strong>.</span>
      </p>
      <p class="text-left">
        <span data-id="pg035_n0092">(iv) Wavuvi walivua samaki <strong>wakubwa</strong>.</span>
      </p>

  </section>
</div>
    </main>

    <div class="relative z-50" id="interface-container"></div>
    <div class="relative z-50" id="nav-container"></div>
    <script src="./assets/offline-preloader.js?v=2"></script>
    <script src="./assets/scorm.js"></script>
    <script src="./assets/read-once.js?v=1"></script>
    <script src="./assets/sign-language-sync.js?v=7"></script>
    <script src="./assets/base.bundle.local.js"></script>
    <script>
      (() => {
        const targets = {
          pg035_n0089: ['(i) Baba alipanda kwenye gari dogo.', 'dogo'],
          pg035_n0090: ['(ii) Limbi anasoma shule iliyopo mbali.', 'mbali'],
          pg035_n0091: ['(iii) Kitanda changu ni kifupi.', 'kifupi'],
          pg035_n0092: ['(iv) Wavuvi walivua samaki wakubwa.', 'wakubwa'],
          pg035_n0093: ['(v) Bibi alivuna mahindi machache.', 'machache']
        };
        const applyBold = () => {
          for (const [id, [text, word]] of Object.entries(targets)) {
            const element = document.querySelector(`[data-id="${id}"]`);
            if (!element || (element.textContent === text && element.querySelector('strong'))) continue;
            const index = text.indexOf(word);
            const strong = document.createElement('strong');
            strong.className = 'font-extrabold text-neutral-950';
            strong.textContent = word;
            element.replaceChildren(
              document.createTextNode(text.slice(0, index)),
              strong,
              document.createTextNode(text.slice(index + word.length))
            );
          }
        };
        applyBold();
        new MutationObserver(applyBold).observe(document.getElementById('content'), {
          childList: true,
          subtree: true
        });
      })();
    </script>
  <script src="./assets/source-bold.js?v=3"></script>

</html>
