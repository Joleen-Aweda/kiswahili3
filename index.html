<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiswahili Kitabu cha Mwanafunzi Darasa la Tatu</title>
    <meta name="title-id" content="pg000_sec001" />
    <meta name="page-section-id" content="1" />
    <meta name="sign-video-index" content="0" />
    <link href="./content/tailwind_output.css" rel="stylesheet">
    <link href="./assets/libs/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="./assets/fonts.css" rel="stylesheet">
    <style>
      .certificate-page {
        width: min(92vw, 554px);
        margin: 0 auto;
        color: #292929;
        font-family: Arial, Helvetica, sans-serif;
      }
      .cover-title-block {
        width: min(92vw, 760px);
        margin: 0 auto 34px;
        text-align: center;
        color: #2e46a0;
      }
      .cover-book-title {
        font-size: clamp(48px, 8vw, 88px);
        font-style: italic;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -.035em;
      }
      .cover-ornament {
        display: flex;
        align-items: center;
        width: min(78vw, 520px);
        margin: 30px auto 28px;
        color: #2e46a0;
      }
      .cover-ornament::before,
      .cover-ornament::after {
        content: "";
        height: 2px;
        flex: 1;
        background: currentColor;
      }
      .cover-ornament-mark {
        margin: 0 10px;
        font-size: 28px;
        line-height: 1;
      }
      .cover-student-book {
        font-size: clamp(23px, 4vw, 38px);
        font-style: italic;
        font-weight: 700;
        line-height: 1.2;
      }
      .cover-grade {
        margin-top: 14px;
        font-size: clamp(30px, 5vw, 48px);
        font-style: italic;
        font-weight: 800;
        line-height: 1.15;
      }
      .certificate-original {
        display: block;
        width: 100%;
        height: auto;
      }
      .certificate-publisher {
        padding: 8px 0 6px;
        text-align: center;
        font-size: clamp(17px, 4vw, 32px);
        font-style: italic;
        font-weight: 900;
      }
      .certificate-accessible-text {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .original-cover {
        display: block;
        width: min(100%, 1116px);
        height: auto;
        margin: 0 auto;
      }
      @media (max-width: 480px) {
        .cover-title-block { width: 94vw; margin-bottom: 22px; }
        .cover-ornament { margin-top: 18px; margin-bottom: 18px; }
        .cover-ornament-mark { font-size: 20px; }
        .cover-grade { margin-top: 9px; }
        .certificate-page { width: 94vw; }
        .certificate-publisher { padding-top: 6px; }
      }
    </style>
    <link href="./assets/responsive-book.css?v=1" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container mx-auto bg-white px-6 py-6 max-lg:px-5 max-sm:px-1 max-sm:py-1 opacity-0">
        <section data-section-type="front_cover" data-section-id="pg000_sec001" class="bg-white">
          <img
            class="original-cover"
            data-id="pg000_im001"
            src="images/kiswahili_front_cover.png"
            alt="Jalada la kitabu cha Kiswahili, Kitabu cha Mwanafunzi, Darasa la Tatu. Wanafunzi wanatoka darasani wakiongozwa na mwalimu."
            width="1387"
            height="1969"
          >
          <div class="certificate-accessible-text">
            <span data-id="pg000_gp001_tx001">Mwisho wa ukurasa wa jalada la mbele.</span>
          </div>
        </section>
      </div>
    </main>

    <div class="relative z-50" id="interface-container"></div>
    <div class="relative z-50" id="nav-container"></div>
    <script src="./assets/offline-preloader.js?v=14"></script>
    <script src="./assets/scorm.js"></script>
    <script src="./assets/read-once.js?v=1"></script>
    <script src="./assets/base.bundle.local.js"></script>
  <script src="./assets/source-bold.js?v=3"></script>
  <script src="./assets/sign-language-sync.js?v=12"></script>
</body>

</html>
